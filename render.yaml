services:
  - type: web
    name: hk-racing-quant-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: ENABLE_DB_ROUTES
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
    plan: free
